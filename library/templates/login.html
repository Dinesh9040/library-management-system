<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Login</h2>
    <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Enter a user name here"><br><br>
    <input type="password" name="password" placeholder="Enter here your password"><br><br>
    <button type="submit">Login</button>
    </form>
    {% if error %}
    <p style="color:red">{{error}}</p>
    {% endif %}
</body>
</html>
